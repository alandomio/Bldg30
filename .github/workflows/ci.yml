name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: bldg30-ci
  cancel-in-progress: false
  queue: max
jobs:
  macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, bldg30]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test gate (translations, wire tests, Swift tests, app build)
        run: bash scripts/test.sh
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent build/ShipDeck.app build/ShipDeck-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShipDeck-macOS
          path: build/ShipDeck-macOS.zip
