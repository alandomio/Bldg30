name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test gate (translations, wire tests, Swift tests, app build)
        run: bash scripts/test.sh
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent build/ShipDeck.app build/ShipDeck-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShipDeck-macOS
          path: build/ShipDeck-macOS.zip
