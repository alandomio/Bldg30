<title>Linear Action Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f6f4;--surface:#ffffff;--ink:#1d2421;--muted:#5c6a64;--line:#dfe4e1;--card-line:#c3ccc7;--card-shadow:0 1px 3px rgba(20,30,25,.12);
  --accent:#1f6f5c;--accent-soft:#e3f0ec;
  --ok:#2e7d4f;--ok-bg:#e4f3ea;--warn:#9a6a00;--warn-bg:#fbf1d9;--bad:#b23b2e;--bad-bg:#fbe6e3;--info:#3a5a8c;--info-bg:#e6ecf6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917;--surface:#1b211f;--ink:#e3e8e5;--muted:#9aa8a2;--line:#2c3532;--card-line:#3d4a45;--card-shadow:0 1px 3px rgba(0,0,0,.5);
  --accent:#5fc0a5;--accent-soft:#1f3530;
  --ok:#7fd3a1;--ok-bg:#1d3326;--warn:#e8c165;--warn-bg:#3a3018;--bad:#f0907f;--bad-bg:#3d2320;--info:#9db8e8;--info-bg:#22304a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141917;--surface:#1b211f;--ink:#e3e8e5;--muted:#9aa8a2;--line:#2c3532;--card-line:#3d4a45;--card-shadow:0 1px 3px rgba(0,0,0,.5);
  --accent:#5fc0a5;--accent-soft:#1f3530;
  --ok:#7fd3a1;--ok-bg:#1d3326;--warn:#e8c165;--warn-bg:#3a3018;--bad:#f0907f;--bad-bg:#3d2320;--info:#9db8e8;--info-bg:#22304a;
  color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:0 16px;}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;display:grid;gap:28px}
header h1{font-size:26px;margin:0;font-weight:600;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
button.chip{font:inherit;font-size:13px;color:inherit;cursor:pointer}
button.chip.on{background:#fde68a;border-color:#d4a017;color:#3b2f00}
.lg{display:contents}
.dptr{font-size:13px;margin:6px 0;color:var(--muted)}.dptr a{font-weight:600}
.row.flash{outline:3px solid #d4a017;transition:outline .3s}[hidden]{display:none!important}
.chip b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
section h2{font-size:17px;margin:0 0 4px;font-weight:600}
section .lede{margin:0 0 12px;color:var(--muted);font-size:14px;max-width:70ch}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.id{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.close{background:var(--ok-bg);color:var(--ok)}
.notyet{background:var(--warn-bg);color:var(--warn)}
.blocked{background:var(--bad-bg);color:var(--bad)}
.hold{background:var(--info-bg);color:var(--info)}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.owner{white-space:nowrap;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:14px}
footer{color:var(--muted);font-size:12.5px}
.banner{margin:0 0 12px;padding:8px 12px;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:6px;font-size:13px}
.ddraft{margin:0 0 8px}.ddh{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.ddraft pre{margin:0;padding:8px 10px;white-space:pre-wrap;font:12.5px/1.45 "IBM Plex Mono",monospace;background:var(--surface);border:1px solid var(--card-line);border-radius:6px}
.decision{padding:8px 10px;border:2px solid var(--accent);border-radius:8px;background:var(--accent-soft)}
.dq{font-weight:600;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.opt{display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.opt small{color:var(--muted);font-size:12px;line-height:1.35}.opt.rec{border-color:var(--accent);background:var(--accent-soft)}
.opt.rec b::after{content:"  recommended";font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11px;color:var(--accent)}
.board{display:grid;gap:14px}
h4.lane{margin:6px 2px -4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:grid;grid-template-columns:5px minmax(0,1fr);background:var(--surface);border:1px solid var(--card-line);border-radius:10px;box-shadow:var(--card-shadow);overflow:hidden}
.stripe.close{background:var(--ok)}.stripe.notyet{background:var(--warn)}.stripe.blocked{background:var(--bad)}.stripe.hold{background:var(--info)}
.rbody{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rtop{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.verb{font-weight:600}.ref{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted)}.rtop .owner{margin-left:auto}
.statusline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px}
.status{display:inline-block;padding:0 7px;border:1px solid;border-radius:4px;font-size:11px;line-height:17px;font-weight:600;cursor:default;pointer-events:none;user-select:none;box-shadow:none}
.finish{font-weight:600;margin-left:6px}
.ctxd>summary{cursor:pointer;color:var(--muted);font-size:13px}.meta{font-size:12px;color:var(--muted);margin-top:4px}
details.waiting{border:1px dashed var(--card-line);border-radius:10px;background:var(--surface)}
details.waiting>summary{cursor:pointer;padding:14px 16px;color:var(--muted);font-size:13px}
details.waiting>.row{margin:0 14px 14px}
section h3{font-size:14px;margin:12px 0 6px}
</style>
